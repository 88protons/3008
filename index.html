<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3008 Seed Map</title>
<meta name="description" content="Work out the pillar and plot layout of any 3008 server from its seed.">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="3008 Seed Map">
<meta property="og:description" content="Work out the pillar and plot layout of any 3008 server from its seed.">
<style>
:root{
 --bg:#000; --panel:#000; --panel2:#000; --line:#444; --line2:#222;
 --text:#c8c8c8; --dim:#888; --acc:#888; --accbg:#111;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
a{color:#aaa}
main{display:flex;flex-direction:column;height:100dvh;min-height:480px;padding:16px;gap:8px}
.top{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.sub{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;margin-left:auto}
.fld{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.fld label{color:var(--dim)}
.sub select{max-width:210px}
.sub input,.sub select,.sub button{font-size:12.5px;padding:4px 8px}
h1{font-size:16px;font-weight:600;margin:0;color:#ddd}
.seedbox{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seedbox label{color:var(--dim);font-size:12px;margin-right:4px}
input,select,button{font:inherit;color:var(--text);background:#000;border:1px solid var(--line);border-radius:0;padding:4px 8px}
input:focus,select:focus,button:focus-visible{outline:1px solid #888;border-color:#888}
#seed{width:200px;font-size:15px;padding:6px 10px;font-variant-numeric:tabular-nums}
input[type=number]{width:58px;font-variant-numeric:tabular-nums}
button{cursor:pointer}
button:hover{background:#111}
.pri{background:#000;border-color:#666;color:#ddd}
.pri:hover{background:#111}
#layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(270px,23vw,350px);gap:8px;flex:1;min-height:0}
#stage{position:relative;background:#000;border:1px solid var(--line);border-radius:0;overflow:hidden;min-height:0;touch-action:none}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
canvas.drag{cursor:grabbing}
.ov{position:absolute;background:#000;border:1px solid var(--line);border-radius:0}
.seg{left:0;top:0;display:flex;gap:0;padding:0}
.tg{border:0;border-right:1px solid var(--line);background:#000;color:var(--dim);padding:4px 10px;border-radius:0;font-size:12px}
.tg:hover{background:#111;color:var(--text)}
.tg.on{background:#222;color:#fff}
.tools{right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden}
.tools button{width:30px;height:30px;padding:0;border:0;border-radius:0;background:transparent;font-size:16px;line-height:1}
.tools button:hover{background:#111}
.tools button+button{border-top:1px solid var(--line)}
.compass{left:0;bottom:0;padding:3px 9px;font-size:11px;color:var(--dim)}
#tip{position:absolute;pointer-events:none;background:#000;border:1px solid #666;color:#ddd;padding:4px 8px;font-size:12px;border-radius:0;display:none;white-space:nowrap;z-index:5}
aside{min-height:0;overflow:hidden;display:flex;flex-direction:column;align-self:start;background:#000;border:1px solid var(--line);border-radius:0}
aside>*{flex:none}
.sec{padding:8px 16px;border-bottom:1px solid var(--line2)}
.sec h2,summary.h{font-size:12px;color:var(--dim);margin:0 0 8px;font-weight:600}
summary.h{cursor:pointer;margin:0;list-style:none}
summary.h::-webkit-details-marker{display:none}
summary.h::before{content:"\25B8 ";display:inline-block;width:12px}
details[open]>summary.h::before{content:"\25BE "}
details[open]>summary.h{margin-bottom:8px}
.row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.row>label{color:var(--dim);font-size:12px;min-width:38px}
.row select{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--line2)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;color:#ddd}
.kv span{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--dim);font-size:12px}
.grp{font-size:11px;color:#6d757f;margin:10px 0 4px}
.grp:first-child{margin-top:0}
.lg{display:flex;align-items:center;gap:8px;padding:2px 0;margin:0;min-width:0;border-radius:0;cursor:pointer;font-size:12.5px}
.lg:hover{background:#111}
.lg.on{background:#222;color:#fff}
.lg .ct{margin-left:auto;color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
.lg.on .ct{color:#c9dbea}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:8px}
.sw{width:12px;height:12px;border-radius:0;flex:none;border:1px solid rgba(0,0,0,.4)}
.sw.rd{border-radius:0}
.matches button{margin:0 4px 4px 0;padding:2px 7px;font-size:11.5px;border-radius:0}
#codekey{font-size:11.5px;color:#9aa3ad;line-height:1.8}
.side{flex:0 1 auto;min-height:0;overflow:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
#key{overflow:visible}
footer{max-width:1100px;margin:0 auto;padding:10px 16px 22px;color:#6d757f;font-size:12px;text-align:center}
footer p{margin:2px 0}
footer a{color:inherit}
@media (max-width:900px){
 main{height:auto;min-height:0}
 #layout{grid-template-columns:1fr}
 #stage{height:auto;aspect-ratio:1/1.24}
 aside{overflow:visible}
 .seedbox{width:100%}
 #seed{flex:1;min-width:0;width:auto}
 .sub{margin-left:0}
}
</style></head><body><main>

<header class="top">
 <h1>3008 Seed Map</h1>
 <div class="seedbox">
  <label for="seed">Seed</label>
  <input id="seed" type="text" value="4123" inputmode="numeric" autocomplete="off" spellcheck="false">
  <button id="rnd">Random</button>
  <button id="cp" class="pri">Copy link</button>
 </div>
 <div class="seedbox">
  <label>Size</label>
  <input id="mx" type="number" min="1" max="51" value="51" aria-label="Map width" style="width:52px">
  <span style="color:var(--dim)">×</span>
  <input id="mz" type="number" min="1" max="51" value="51" aria-label="Map height" style="width:52px">
  <label style="margin-left:8px;display:flex;align-items:center;gap:4px;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--text)">
   <input id="t_pil" type="checkbox" checked style="width:auto;margin:0"> Pillars
  </label>
 </div>
 <div class="sub">
  <span class="fld"><label for="hl">Find</label><select id="hl"><option value="">Nothing</option></select></span>
  <span class="fld"><label for="gx">Go to</label>X <input id="gx" type="number" min="1" max="51" value="1" aria-label="Go to X"> Z <input id="gz" type="number" min="1" max="51" value="1" aria-label="Go to Z"><button id="gobtn">Go</button></span>
 </div>
</header>

<div id="layout">
 <div id="stage">
  <canvas id="cv"></canvas>
  <div id="tip" role="tooltip" aria-live="polite">Hover a cell</div>
  <div class="ov seg" role="group" aria-label="Map layers">
   <button class="tg on" id="t_grid">Sectors</button>
  </div>
  <div class="ov compass" aria-hidden="true">X &uarr; &nbsp;Z &rarr;</div>
  <div class="ov tools"><button id="zi" title="Zoom in" aria-label="Zoom in">+</button><button id="zo" title="Zoom out" aria-label="Zoom out">&minus;</button><button id="fit" title="Fit map" aria-label="Fit map to view">&#9635;</button></div>
 </div>
 <aside>
  <div class="side">
  <section class="sec" id="info"><h2>Selection</h2><div class="note">Click a cell on the map.</div></section>
  <section class="sec matches" id="mt" style="display:none"><h2>Found</h2></section>
  <section class="sec ksec"><details open><summary class="h">Key</summary><div id="key"><span class="note">Loading key.</span></div>
   <details style="margin-top:10px"><summary class="h">Plot codes</summary><div id="codekey"><span class="note">Loading codes.</span></div></details></details></section>
  <section class="sec"><h2>This seed</h2><div id="shl"><span class="note">Enter a seed.</span></div>
</section>
  </div>
 </aside>
</div>

</main>

</footer>

   var u=sm(a+1,b),d=sm(a-1,b),l=sm(a,b-1),rt=sm(a,b+1);
   if(r===1)return c===0?l:rt; if(c===1)return r===0?u:d;
   if(r===0&&c===0)return u&&l&&sm(a+1,b-1); if(r===0&&c===2)return u&&rt&&sm(a+1,b+1);
   if(r===2&&c===0)return d&&l&&sm(a-1,b-1); return d&&rt&&sm(a-1,b+1)};
  var NB=function(a,b,r,c,dr,dc){r+=dr;c+=dc;if(r<0){r=2;a++}else if(r>2){r=0;a--}if(c<0){c=2;b--}else if(c>2){c=0;b++}return SUB(a,b,r,c)};
  var g=gap,lw=Math.max(1,cs*0.07),fp={},op={},all=new Path2D();
  var COL={'cafeteria':['#c85a2a','#eaa178'],'industrial shelf':['#2fa6c2','#7fd0de']};
  for(var i=Math.max(0,i0-1);i<=Math.min(rows-1,i1+1);i++)for(var j=Math.max(0,j0-1);j<=Math.min(cols-1,j1+1);j++){
   var x=S.X-i,z=j+1,t=BIG(x,z);if(!t)continue;
   var px=S.tx+j*cs,py=S.ty+i*cs,XE=[px,px+g,px+cs-g,px+cs],YE=[py,py+g,py+cs-g,py+cs];
   if(!fp[t]){fp[t]=new Path2D();op[t]=new Path2D()}
   for(var r=0;r<3;r++)for(var c=0;c<3;c++){if(!SUB(x,z,r,c))continue;
    var x0=XE[c],x1=XE[c+1],y0=YE[r],y1=YE[r+1];
    fp[t].rect(x0,y0,x1-x0,y1-y0);all.rect(x0,y0,x1-x0,y1-y0);
    if(!NB(x,z,r,c,-1,0)){op[t].moveTo(x0,y0);op[t].lineTo(x1,y0)}
    if(!NB(x,z,r,c,1,0)){op[t].moveTo(x0,y1);op[t].lineTo(x1,y1)}
    if(!NB(x,z,r,c,0,-1)){op[t].moveTo(x0,y0);op[t].lineTo(x0,y1)}
    if(!NB(x,z,r,c,0,1)){op[t].moveTo(x1,y0);op[t].lineTo(x1,y1)}}}
  for(var t in fp){ctx.fillStyle=COL[t][0];ctx.fill(fp[t])}
  if(cs>=4){ctx.save();ctx.clip(all);ctx.lineCap='square';ctx.lineWidth=2*lw;
   for(var t in op){ctx.strokeStyle=COL[t][1];ctx.stroke(op[t])}
   ctx.restore()}}
 for(var i=i0;i<=i1;i++)for(var j=j0;j<=j1;j++){
  var x=S.X-i,z=j+1,key=x+','+z;
  var px=S.tx+j*cs,py=S.ty+i*cs;
  var p=S.pill[key],r=S.res[key];
  var band=((Math.floor((x+5)/8)+Math.floor((z+5)/8))%2)===0;
    var fill;
  if(p)fill='#23272d';
  else if(r&&STRUCT[r.t[0]])fill=STRUCT[r.t[0]];
  else if(r)fill=colOf(r.t[0]);
  else fill='#262b31';
  ctx.fillStyle=fill;
  if(!(r&&r.big)){ctx.fillRect(px+gap,py+gap,cs-2*gap,cs-2*gap);}
  if(r&&!p&&RARE[r.t[0]]&&!r.big&&cs>=5){ctx.strokeStyle='#e0b53a';ctx.lineWidth=Math.max(1.5,cs*0.07);ctx.strokeRect(px+gap+1,py+gap+1,cs-2*gap-2,cs-2*gap-2)}
  if(cs>=7&&!(r&&r.big)){ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.strokeRect(px+gap+.5,py+gap+.5,cs-2*gap-1,cs-2*gap-1)}

  if(p){var cx=px+cs/2,cy=py+cs/2,rad=Math.max(1.5,cs*0.34);
   ctx.fillStyle=p.dead?'#454b53':PK[p.k][1];
   ctx.beginPath();ctx.arc(cx,cy,rad,0,6.2832);ctx.fill();
   if(p.k!=='N'){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=Math.max(1,cs*0.05);ctx.stroke()}
   if(p.dead&&cs>=12){ctx.strokeStyle='rgba(230,235,240,.7)';ctx.lineWidth=Math.max(1,cs*0.06);
    ctx.beginPath();ctx.moveTo(cx-rad*.6,cy-rad*.6);ctx.lineTo(cx+rad*.6,cy+rad*.6);
    ctx.moveTo(cx+rad*.6,cy-rad*.6);ctx.lineTo(cx-rad*.6,cy+rad*.6);ctx.stroke()}}
  if(S.unsure&&r&&!r.sure&&!p&&!r.big){
   ctx.fillStyle='rgba(232,150,40,.5)';ctx.fillRect(px+gap,py+gap,cs-2*gap,cs-2*gap);
   if(cs>=16){ctx.strokeStyle='#f0a62e';ctx.lineWidth=Math.max(1.5,cs*0.05);
    ctx.strokeRect(px+gap+1.5,py+gap+1.5,cs-2*gap-3,cs-2*gap-3)}}
  if(S.hl&&matches(key,x,z)){ctx.fillStyle='rgba(90,175,240,.28)';ctx.fillRect(px+gap,py+gap,cs-2*gap,cs-2*gap);
   ctx.strokeStyle='#6fc0ff';ctx.lineWidth=Math.max(1.5,cs*0.09);ctx.strokeRect(px+gap+1,py+gap+1,cs-2*gap-2,cs-2*gap-2)}
  if(p){if(cs>=26){ctx.fillStyle='#fff';ctx.font='600 '+Math.max(9,Math.min(15,cs*0.3))+'px "Segoe UI",system-ui,sans-serif';ctx.fillText(p.label,px+cs/2,py+cs/2)}}
  else if(r){
   var isS=!!STRUCT[r.t[0]];
   var nm=r.big?(r.anchor?cap(r.t[0]):''):cap(r.t[0]);
   if(showName&&nm){ctx.fillStyle=isS?'#fff':'#d2d8de';var fs=Math.max(9,Math.min(13,cs*0.15));ctx.font=fs+'px "Segoe UI",system-ui,sans-serif';
    var lines=wrap(ctx,nm,cs-2*gap-6,3);lines.forEach(function(l,li){ctx.fillText(l,px+cs/2,py+cs/2+(li-(lines.length-1)/2)*(fs+1))});
    if(!r.sure&&r.t[1]){ctx.fillStyle='#b08a4e';ctx.font=Math.max(8,fs-3)+'px "Segoe UI",system-ui,sans-serif';ctx.fillText('or '+cap(r.t[1]),px+cs/2,py+cs-gap-fs*0.9)}
   }
   else if(showAbb3&&!(r.big&&!r.anchor)){
    var code=ABB3[r.t[0]]||'?';
    var cfs=Math.max(10,Math.min(14,cs*0.3));

    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText(code,px+cs/2+.6,py+cs/2+.6);
    ctx.fillStyle=isS?'#fff':'rgba(238,243,248,.95)';ctx.fillText(code,px+cs/2,py+cs/2)}}
  if(S.sel&&S.sel[0]===x&&S.sel[1]===z){ctx.strokeStyle='#ff5a4a';ctx.lineWidth=2.5;ctx.strokeRect(px+1.5,py+1.5,cs-3,cs-3)}}

 if(S.grid&&cs>=3){var gw=Math.max(1,Math.min(3,cs*0.09)),bb=Math.max(S.X,S.Z)+1;
  var seg=function(){ctx.beginPath();
   for(var b=2;b<=bb;b+=8){
    ctx.moveTo(S.tx+(b-1)*cs,S.ty);ctx.lineTo(S.tx+(b-1)*cs,S.ty+rows*cs);
    ctx.moveTo(S.tx,S.ty+(S.X-b+1)*cs);ctx.lineTo(S.tx+cols*cs,S.ty+(S.X-b+1)*cs)}
   ctx.stroke()};
  if(cs>=18)ctx.setLineDash([cs*0.55,cs*0.35]);else ctx.setLineDash([]);
  ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=gw+(cs<10?1:2);seg();
  ctx.strokeStyle='rgba(175,220,255,.95)';ctx.lineWidth=gw;seg();
  ctx.setLineDash([])}
 ctx.strokeStyle='rgba(150,165,180,.45)';ctx.lineWidth=1;ctx.strokeRect(S.tx-.5,S.ty-.5,cols*cs+1,rows*cs+1);
 if(cs>=9){ctx.fillStyle='#8a929c';ctx.font='10px "Segoe UI",system-ui,sans-serif';ctx.textBaseline='middle';
  for(var jj=j0;jj<=j1;jj++){if((jj+1)%5)continue;ctx.textAlign='center';ctx.fillText(String(jj+1),S.tx+(jj+.5)*cs,Math.max(7,S.ty-7))}
  ctx.textAlign='right';for(var ii=i0;ii<=i1;ii++){if((S.X-ii)%5)continue;ctx.fillText(String(S.X-ii),Math.max(16,S.tx-5),S.ty+(ii+.5)*cs)}

function wrap(c,t,maxw,maxl){var words=t.split(' '),lines=[],cur='';words.forEach(function(w){var tr=cur?cur+' '+w:w;if(c.measureText(tr).width<=maxw||!cur)cur=tr;else{lines.push(cur);cur=w}});if(cur)lines.push(cur);if(lines.length>maxl){lines=lines.slice(0,maxl);lines[maxl-1]+='…'}return lines}

function info(x,z){var key=x+','+z,p=S.pill[key],r=S.res[key];
 var h='<h2>Cell '+x+' x '+z+'</h2>';
 if(p){h+='<div class="kv"><b>Pillar '+p.label+'</b><span>'+PK[p.k][0]+'</span></div>'
  +'<div class="kv"><b>Roll</b><span>'+p.roll.toFixed(6)+'</span></div>';
  if(p.dead)h+='<div class="note" style="margin-top:6px">An industrial shelf runs through this cell, which deletes the pillar.</div>';
  if(p.k==='R'||p.k==='S')h+='<div class="note" style="margin-top:6px">Pallets can delete any pillar, specials included.</div>'}
 else if(r&&r.big){var b=r.big;
  h+='<div class="kv"><b>'+cap(b.type)+'</b><span>'+b.cells.length+' cells</span></div>'
   +'<div class="kv"><b>Starts at</b><span>'+b.anchor[0]+'x'+b.anchor[1]+'</span></div>'
   +'<div class="kv"><b>Trigger roll</b><span>'+b.v.toFixed(6)+'</span></div>'
   +'<div class="note" style="margin-top:6px">Covers '+b.cells.map(function(q){return q[0]+'x'+q[1]}).join(', ')+'.</div>'}
 else if(r){
  h+='<div class="kv"><b>'+cap(r.t[0])+'</b><span>'+(r.sure?'confirmed':'likely')+'</span></div>'
   +(r.t[1]?'<div class="kv"><b>or '+cap(r.t[1])+'</b><span>alternative</span></div>':'')
   +'<div class="kv"><b>Roll</b><span>'+r.v.toFixed(6)+'</span></div>'
   +'<div class="kv"><b>List position</b><span>'+r.k+'</span></div>';
  if(r.thrown)h+='<div class="kv"><b>Re-rolls before it</b><span>'+r.thrown+'</span></div>';
  if(!r.sure)h+='<div class="note" style="margin-top:6px">This roll lands in a gap between two confirmed entries, so it is one of the two above.</div>';
  }
 else h+='<div class="note">Nothing here.</div>';
 $('info').innerHTML=h}

function updateMatches(){var m=$('mt');if(!S.hl){m.style.display='none';return}
 var list=[],seen={};
 Object.keys(S.pill).concat(Object.keys(S.res)).forEach(function(k){if(seen[k])return;seen[k]=1;var a=k.split(',').map(Number);if(matches(k,a[0],a[1]))list.push(k)});
 list.sort(function(a,b){var p=a.split(',').map(Number),q=b.split(',').map(Number);return p[0]-q[0]||p[1]-q[1]});
 m.style.display='block';
 m.innerHTML='<h2>Found: '+list.length+' cell'+(list.length===1?'':'s')+'</h2><div>'+list.slice(0,40).map(function(k){return '<button data-k="'+k+'">'+k.replace(',','x')+'</button>'}).join('')+(list.length>40?'<div class="note">First 40 shown. Click one to jump there.</div>':'')+'</div>';

function center(x,z){S.sc=Math.max(S.sc,46);var i=S.X-x,j=z-1;S.tx=W/2-(j+.5)*S.sc;S.ty=H/2-(i+.5)*S.sc;draw()}

function zoomAt(f,px,py){S.touched=true;var ns=Math.max(3,Math.min(200,S.sc*f));f=ns/S.sc;S.tx=px-(px-S.tx)*f;S.ty=py-(py-S.ty)*f;S.sc=ns;draw()}
cv.addEventListener('wheel',function(e){e.preventDefault();var r=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top)},{passive:false});
var ptrs={},dragged=0,last=null,pinch=0,tip=$('tip');
function showTip(e,c){if(!c){tip.style.display='none';return}

 if(p)txt+='Pillar '+p.label+', '+PK[p.k][0]+(p.dead?' (deleted)':'');

cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]=[e.clientX,e.clientY];dragged=0;last=[e.clientX,e.clientY];cv.classList.add('drag');var ids=Object.keys(ptrs);if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
